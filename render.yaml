services:
  - type: web
    name: board2-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: board2-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: board2-db
    plan: free
    region: singapore
    databaseName: board2
    user: board2
    ipAllowList: []
